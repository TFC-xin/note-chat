<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>信笺</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">信</span>
          <span class="brand-name">信笺</span>
        </div>
        <div class="meta">
          <span class="meta-dot" id="statusDot"></span>
          <span class="meta-text" id="statusText">未连接</span>
        </div>
      </div>
    </header>

    <main class="stream" id="stream">
      <div class="empty" id="emptyState">
        <div class="empty-quote">
          <p class="empty-line">愿你的字迹</p>
          <p class="empty-line">落在某人心里</p>
          <p class="empty-line empty-line--last">长出花来</p>
        </div>
        <p class="empty-hint">在下方信笺上书写，发送给此刻在线的旅人</p>
      </div>
    </main>

    <section class="compose">
      <div class="compose-frame">
        <canvas id="paper" class="paper"></canvas>
        <div class="compose-hint" id="composeHint"><span>提笔，落墨</span></div>
      </div>

      <div class="compose-toolbar">
        <div class="toolbar-left">
          <button class="tool" id="btnUndo" type="button" title="撤回一笔">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>
            </svg>
            <span>撤回</span>
          </button>
          <button class="tool" id="btnClear" type="button" title="重新开始">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
            <span>清空</span>
          </button>
        </div>
        <div class="toolbar-right">
          <button class="send" id="btnSend" type="button">
            <span class="send-label">寄出</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <div class="modal" id="modal">
      <div class="modal-card">
        <p class="modal-eyebrow">落款</p>
        <h2 class="modal-title">给自己起个名</h2>
        <p class="modal-sub">它会出现在你寄出的每一张纸上</p>
        <input type="text" id="nameInput" class="modal-input" placeholder="例如：听雨的人" maxlength="10" autocomplete="off">
        <button class="modal-cta" id="btnJoin" type="button">入席</button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="viewer-card">
        <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
        <div class="viewer-frame"><canvas id="viewerCanvas" class="viewer-paper"></canvas></div>
        <div class="viewer-foot">
          <div class="viewer-author" id="viewerAuthor">—— 匿名</div>
          <div class="viewer-progress" id="viewerProgress">正在落笔…</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
