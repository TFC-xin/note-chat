<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小纸条</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-mark" src="assets/logo.png" alt="TFC">
          <span class="brand-name">小纸条</span>
        </div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="btnRoom" type="button" title="切换房间">
            <span class="room-label" id="roomLabel">大厅</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="topbar-btn" id="btnOnline" type="button" title="在线">
            <span class="online-dot"></span>
            <span class="online-count" id="onlineCount">0</span>
          </button>
          <button class="topbar-btn icon-only" id="btnSettings" type="button" title="设置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
          <span class="meta"><span class="meta-dot" id="statusDot"></span></span>
        </div>
      </div>
    </header>

    <main class="stream" id="stream">
      <div class="empty" id="emptyState">
        <div class="empty-quote">
          <p class="empty-line">愿你的字迹</p>
          <p class="empty-line">落在某人心里</p>
          <p class="empty-line empty-line--last">长出花来</p>
        </div>
        <p class="empty-hint">在下方信笺上书写，发送给此刻在线的旅人</p>
      </div>
    </main>

    <section class="compose">
      <div class="compose-frame">
        <canvas id="paper" class="paper"></canvas>
        <div class="compose-hint" id="composeHint"><span>提笔，落墨</span></div>
      </div>

      <div class="kaomoji-tray" id="kaomojiTray">
        <button class="kaomoji-chip" data-emoji="( ^o^)">( ^o^)</button>
        <button class="kaomoji-chip" data-emoji="(*^_^*)">(*^_^*)</button>
        <button class="kaomoji-chip" data-emoji="(´･ω･`)">(´･ω･`)</button>
        <button class="kaomoji-chip" data-emoji="(╥﹏╥)">(╥﹏╥)</button>
        <button class="kaomoji-chip" data-emoji="(&gt;_&lt;)">(&gt;_&lt;)</button>
        <button class="kaomoji-chip" data-emoji="(T_T)">(T_T)</button>
        <button class="kaomoji-chip" data-emoji="¯\_(ツ)_/¯">¯\_(ツ)_/¯</button>
        <button class="kaomoji-chip" data-emoji="(¬_¬)">(¬_¬)</button>
        <button class="kaomoji-chip" data-emoji="(◕‿◕)">(◕‿◕)</button>
        <button class="kaomoji-chip" data-emoji="(●´∀`●)">(●´∀`●)</button>
        <button class="kaomoji-chip" data-emoji="(✿◠‿◠)">(✿◠‿◠)</button>
        <button class="kaomoji-chip" data-emoji="Σ(°△°|||)">Σ(°△°|||)</button>
        <button class="kaomoji-more" id="kaomojiMore" type="button">+</button>
      </div>

      <div class="compose-toolbar">
        <div class="toolbar-left">
          <button class="tool" id="btnUndo" type="button" title="撤回一笔">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
            <span>撤回</span>
          </button>
          <button class="tool" id="btnClear" type="button" title="重新开始">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            <span>清空</span>
          </button>
        </div>
        <div class="toolbar-right">
          <button class="send" id="btnSend" type="button">
            <span class="send-label">寄出</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="modal" id="modal">
      <div class="modal-card">
        <p class="modal-eyebrow">落款</p>
        <h2 class="modal-title">给自己起个名</h2>
        <p class="modal-sub">它会出现在你寄出的每一张纸上</p>
        <div class="avatar-picker">
          <div class="avatar-preview" id="avatarPreview">
            <span class="avatar-letter" id="avatarLetter">·</span>
          </div>
          <label class="avatar-upload" for="avatarInput" title="从相册选择头像">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>选头像</span>
          </label>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
        <input type="text" id="nameInput" class="modal-input" placeholder="例如：听雨的人" maxlength="10" autocomplete="off">
        <button class="modal-cta" id="btnJoin" type="button">入席</button>
        <p class="modal-hint" id="modalHint">下次会自动填好</p>
      </div>
    </div>

    <div class="panel" id="onlinePanel">
      <div class="panel-head">
        <h3>在线</h3>
        <button class="panel-close" id="onlineClose" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="panel-body" id="onlineList"></div>
    </div>

    <div class="panel" id="roomPanel">
      <div class="panel-head">
        <h3>选择房间</h3>
        <button class="panel-close" id="roomClose" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="panel-body">
        <button class="room-item active" data-room="lobby" type="button">
          <span class="room-name">大厅</span>
          <span class="room-meta">所有人可见</span>
        </button>
        <div class="room-section">私聊</div>
        <div id="roomPrivateList"></div>
      </div>
    </div>

    <div class="panel" id="settingsPanel">
      <div class="panel-head">
        <h3>设置</h3>
        <button class="panel-close" id="settingsClose" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="panel-body settings-body">
        <div class="setting-row">
          <label>墨色</label>
          <input type="color" id="inkColor" value="#1a1a1a">
        </div>
        <div class="setting-row">
          <label>纸色</label>
          <input type="color" id="paperColor" value="#faf7f0">
        </div>
        <div class="setting-row">
          <label>背景</label>
          <input type="color" id="bgColor" value="#f5f0e4">
        </div>
        <div class="setting-row">
          <label>墨粗</label>
          <input type="range" id="inkWidth" min="1" max="6" step="0.5" value="2.2">
        </div>
        <div class="setting-row setting-identity">
          <label>身份</label>
          <div class="identity-actions">
            <button class="identity-btn" id="changeName" type="button">改名</button>
            <button class="identity-btn" id="changeAvatar" type="button">换头像</button>
          </div>
        </div>
        <button class="settings-reset" id="settingsReset" type="button">恢复默认</button>
        <div class="settings-copyright">2026 TFC studio</div>
      </div>
    </div>

    <div class="loading-bar" id="loadingBar">
      <div class="loading-fill" id="loadingFill"></div>
    </div>
    <div class="loading-text" id="loadingText">正在加载...</div>

    <div class="viewer" id="viewer">
      <div class="viewer-card">
        <button class="viewer-close" id="viewerClose" type="button" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="viewer-frame"><canvas id="viewerCanvas" class="viewer-paper"></canvas></div>
        <div class="viewer-foot">
          <div class="viewer-author" id="viewerAuthor">—— 匿名</div>
          <div class="viewer-progress" id="viewerProgress">正在落笔…</div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/kaomoji.js"></script>
  <script src="js/note.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
